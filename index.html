<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاحص إطارات واتساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E7EBF0;
    --panel: #FAFBFC;
    --ink: #141D28;
    --muted: #5A6676;
    --line: #C7CFDA;
    --code: #EEF1F5;
    --accent: #2C3BCB;
    --accent-ink: #FFFFFF;
    --dec: #2C3BCB;
    --raw: #7F8B9C;
    --ok: #17794A;
    --warn: #9A5B00;
    --bad: #B3261E;
    --sans: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151C; --panel: #18202A; --ink: #E6EBF2; --muted: #93A0B2;
      --line: #2B3644; --code: #0F141B; --accent: #8A96FF; --accent-ink: #0E1220;
      --dec: #8A96FF; --raw: #6C7889; --ok: #4FC08A; --warn: #E0A04A; --bad: #FF8A80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; height: 100%; padding: 14px; }
  .side, .main { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; }
  .side { padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 18px; }
  .main { display: flex; flex-direction: column; overflow: hidden; }

  h1 { font-size: 20px; font-weight: 600; margin: 0; line-height: 1.3; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }

  .status { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--raw); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }

  .qr { display: grid; place-items: center; min-height: 100px; }
  .qr img { width: 100%; max-width: 280px; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .qr p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }

  .send { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  input, textarea { width: 100%; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
  textarea { resize: vertical; }
  .primary { padding: 9px 14px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 500; cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .note { margin: 0; min-height: 1.4em; font-size: 13px; color: var(--muted); }
  .note.bad { color: var(--bad); }
  .note.ok { color: var(--ok); }

  .chat { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .chat li { padding: 8px 10px; background: var(--code); border-radius: 6px; font-size: 14px; overflow-wrap: anywhere; }
  .chat .who { display: block; font: 12px var(--mono); color: var(--muted); direction: ltr; text-align: right; }
  .chat:empty::after { content: "ستظهر هنا الرسائل الواردة."; color: var(--muted); font-size: 14px; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .toolbar input[type="search"] { width: 220px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); }
  .check input { width: auto; }
  .ghost { padding: 6px 12px; background: transparent; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .ghost:hover { border-color: var(--accent); }
  .grow { flex: 1; }
  .count { font: 13px var(--mono); color: var(--muted); direction: ltr; }

  .cols, .row-head { display: grid; grid-template-columns: 112px 190px minmax(0, 1fr); gap: 12px; align-items: center; padding: 0 14px; }
  .cols { padding-block: 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .frames { flex: 1; overflow: auto; }

  .row { border-bottom: 1px solid var(--line); }
  .row-head { width: 100%; padding-block: 7px; background: none; border: 0; text-align: start; cursor: pointer; }
  .row-head:hover { background: var(--code); }
  .time { font: 13px var(--mono); color: var(--muted); direction: ltr; text-align: right; }
  .size { display: flex; align-items: center; gap: 8px; }
  .num { font: 13px var(--mono); direction: ltr; min-width: 58px; text-align: right; }
  .track { flex: 1; height: 8px; }
  .bar { display: block; height: 100%; border-radius: 2px; background: var(--dec); }
  .raw .bar { background: repeating-linear-gradient(135deg, var(--raw) 0 4px, transparent 4px 7px); outline: 1px solid var(--raw); outline-offset: -1px; }
  .summary { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .badge { flex: none; padding: 0 8px; border-radius: 4px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .decoded .badge { border-color: var(--dec); color: var(--dec); }
  .sum-text { font: 13px var(--mono); direction: ltr; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }

  .detail { margin: 0; padding: 12px 14px 14px; background: var(--code); font: 12.5px/1.6 var(--mono); direction: ltr; text-align: left; overflow-x: auto; white-space: pre; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .main { height: 70vh; }
    .cols, .row-head { grid-template-columns: 92px 1fr; }
    .cols span:nth-child(2), .size { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div>
      <h1>فاحص إطارات واتساب</h1>
      <p class="status" role="status"><span class="dot" id="dot"></span><span id="statusText">جارٍ الاتصال بالخادم المحلي…</span></p>
    </div>

    <div class="qr" id="qrBox"></div>

    <form class="send" id="sendForm" autocomplete="off">
      <h2>إرسال رسالة</h2>
      <label>الرقم مع رمز الدولة
        <input id="to" dir="ltr" inputmode="tel" placeholder="9627XXXXXXXX" required>
      </label>
      <label>نص الرسالة
        <textarea id="text" rows="3" required></textarea>
      </label>
      <button class="primary" id="sendBtn" type="submit" disabled>أرسل الرسالة</button>
      <p class="note" id="sendNote"></p>
    </form>

    <section>
      <h2>الرسائل الواردة</h2>
      <ul class="chat" id="chat"></ul>
    </section>
  </aside>

  <main class="main">
    <div class="toolbar">
      <label class="check"><input type="checkbox" id="fDecoded" checked> إطارات مفكوكة</label>
      <label class="check"><input type="checkbox" id="fRaw" checked> إطارات خام مشفّرة</label>
      <input type="search" id="fText" placeholder="تصفية: iq أو message أو receipt…" aria-label="تصفية حسب الوسم">
      <span class="grow"></span>
      <span class="count" id="count">0</span>
      <button class="ghost" id="pauseBtn" type="button">أوقف العرض</button>
      <button class="ghost" id="clearBtn" type="button">امسح</button>
      <button class="ghost" id="saveBtn" type="button">نزّل JSON</button>
    </div>
    <div class="cols"><span>الوقت</span><span>الحجم (مقياس لوغاريتمي)</span><span>الإطار</span></div>
    <div class="frames" id="frames"></div>
  </main>
</div>

<script>
'use strict'
const $ = (s) => document.querySelector(s)
const MAX_ROWS = 600
const MAX_STORE = 3000

let frames = []
let paused = false
let pending = 0
let ws = null
let status = 'bridge_down'

// ---------- أدوات ----------
function el(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text !== undefined) e.textContent = text
  return e
}

const fmtTime = (ts) => {
  const d = new Date(ts)
  const p = (n, l = 2) => String(n).padStart(l, '0')
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`
}

function hexdump(hex, truncated) {
  const lines = []
  for (let i = 0; i < hex.length; i += 32) {
    const chunk = hex.slice(i, i + 32).match(/../g) || []
    const ascii = chunk.map((h) => {
      const c = parseInt(h, 16)
      return c >= 32 && c < 127 ? String.fromCharCode(c) : '.'
    }).join('')
    lines.push(`${(i / 2).toString(16).padStart(4, '0')}  ${chunk.join(' ').padEnd(47)}  ${ascii}`)
  }
  if (truncated) lines.push('…  (اقتُطع الإطار للمعاينة)')
  return lines.join('\n')
}

function toXml(n, d = 0) {
  const pad = '  '.repeat(d)
  if (n === null || typeof n !== 'object') return pad + String(n)
  const attrs = Object.entries(n.attrs || {}).map(([k, v]) => ` ${k}="${v}"`).join('')
  const c = n.content
  if (c === undefined) return `${pad}<${n.tag}${attrs}/>`
  if (Array.isArray(c)) return `${pad}<${n.tag}${attrs}>\n${c.map((x) => toXml(x, d + 1)).join('\n')}\n${pad}</${n.tag}>`
  if (typeof c === 'object' && 'bytes' in c) return `${pad}<${n.tag}${attrs}>[${c.bytes} bytes] ${c.hex}${c.truncated ? '…' : ''}</${n.tag}>`
  return `${pad}<${n.tag}${attrs}>${c}</${n.tag}>`
}

function summaryOf(f) {
  if (f.kind === 'raw') return `Noise frame  ${(f.hex.slice(0, 16).match(/../g) || []).join(' ')}…`
  const a = f.node.attrs || {}
  const keys = ['type', 'xmlns', 'id'].filter((k) => a[k])
  return `<${f.node.tag}${keys.map((k) => ` ${k}="${a[k]}"`).join('')}>`
}

// ---------- الحالة ----------
const STATUS = {
  bridge_down: ['bad', 'انقطع الاتصال بالخادم المحلي. شغّل: npm start'],
  starting: ['warn', 'يبدأ الخادم…'],
  connecting: ['warn', 'جارٍ الاتصال بواتساب…'],
  qr: ['warn', 'بانتظار مسح الرمز'],
  open: ['ok', 'متصل بواتساب'],
  reconnecting: ['warn', 'انقطع الاتصال. تتم إعادة المحاولة…'],
  logged_out: ['bad', 'سُجّل الخروج من الهاتف. سيظهر رمز جديد'],
}

function renderState(s) {
  status = s.status
  const [cls, label] = STATUS[status] || ['warn', status]
  $('#dot').className = 'dot ' + cls
  $('#statusText').textContent = status === 'open' && s.me ? `${label} (${s.me.split('@')[0].split(':')[0]})` : label
  $('#sendBtn').disabled = status !== 'open'

  const box = $('#qrBox')
  box.replaceChildren()
  if (s.qr) {
    const img = el('img')
    img.src = s.qr
    img.alt = 'رمز QR لربط الجهاز'
    box.append(img, el('p', '', 'على الهاتف: الإعدادات ← الأجهزة المرتبطة ← ربط جهاز، ثم امسح الرمز.'))
  } else if (status === 'open') {
    box.append(el('p', '', 'الجهاز مرتبط. تُعرض الإطارات على اليسار مباشرة.'))
  }
}

// ---------- قائمة الإطارات ----------
const framesBox = $('#frames')

function passes(f) {
  if (f.kind === 'raw' && !$('#fRaw').checked) return false
  if (f.kind === 'decoded' && !$('#fDecoded').checked) return false
  const q = $('#fText').value.trim().toLowerCase()
  return !q || summaryOf(f).toLowerCase().includes(q)
}

function rowEl(f) {
  const row = el('div', `row ${f.kind}`)
  const head = el('button', 'row-head')
  head.type = 'button'
  head.setAttribute('aria-expanded', 'false')

  const size = el('div', 'size')
  const label = f.kind === 'raw' ? `${f.len} B` : `~${f.approx}`
  size.title = f.kind === 'raw' ? 'حجم الإطار كما وصل عبر الشبكة' : 'حجم تقريبي للـ stanza بعد الفك'
  const track = el('span', 'track')
  const bar = el('i', 'bar')
  const value = f.kind === 'raw' ? f.len : f.approx
  bar.style.width = Math.max(3, Math.min(100, (Math.log2(value + 1) / 14) * 100)) + '%'
  track.append(bar)
  size.append(el('span', 'num', label), track)

  const sum = el('div', 'summary')
  sum.append(el('span', 'badge', f.kind === 'raw' ? 'خام' : 'مفكوك'), el('span', 'sum-text', summaryOf(f)))

  head.append(el('span', 'time', fmtTime(f.ts)), size, sum)

  let detail = null
  head.addEventListener('click', () => {
    if (detail) {
      detail.remove()
      detail = null
      head.setAttribute('aria-expanded', 'false')
      return
    }
    detail = el('pre', 'detail', f.kind === 'raw' ? hexdump(f.hex, f.truncated) : toXml(f.node))
    row.append(detail)
    head.setAttribute('aria-expanded', 'true')
  })

  row.append(head)
  return row
}

function renderAll() {
  framesBox.replaceChildren()
  const shown = frames.filter(passes).slice(-MAX_ROWS)
  if (!shown.length) framesBox.append(el('div', 'empty', 'لا توجد إطارات بعد. ستظهر هنا فور بدء الاتصال.'))
  else framesBox.append(...shown.map(rowEl))
  framesBox.scrollTop = framesBox.scrollHeight
  $('#count').textContent = `${frames.length}`
}

function addFrame(f) {
  frames.push(f)
  if (frames.length > MAX_STORE) frames.shift()
  $('#count').textContent = `${frames.length}`
  if (paused) { pending++; $('#pauseBtn').textContent = `تابع العرض (${pending} جديد)`; return }
  if (!passes(f)) return

  const nearBottom = framesBox.scrollHeight - framesBox.scrollTop - framesBox.clientHeight < 80
  if (framesBox.querySelector('.empty')) framesBox.replaceChildren()
  framesBox.append(rowEl(f))
  while (framesBox.children.length > MAX_ROWS) framesBox.firstChild.remove()
  if (nearBottom) framesBox.scrollTop = framesBox.scrollHeight
}

// ---------- الرسائل الواردة ----------
function addChat(m) {
  const li = el('li')
  const who = el('span', 'who', `${m.fromMe ? 'أنا ← ' : ''}${(m.from || '').split('@')[0]}`)
  li.append(who, document.createTextNode(m.text)) // نص من طرف خارجي: لا نستخدم innerHTML أبداً
  const list = $('#chat')
  list.prepend(li)
  while (list.children.length > 30) list.lastChild.remove()
}

// ---------- الاتصال بالجسر ----------
function connect() {
  ws = new WebSocket(`ws://${location.host}`)
  ws.onopen = () => {}
  ws.onclose = () => {
    renderState({ status: 'bridge_down' })
    setTimeout(connect, 2000)
  }
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data)
    if (m.type === 'state') renderState(m)
    else if (m.type === 'raw') addFrame({ kind: 'raw', ts: m.ts, len: m.len, hex: m.hex, truncated: m.truncated })
    else if (m.type === 'frame') addFrame({ kind: 'decoded', ts: m.ts, node: m.node, approx: JSON.stringify(m.node).length })
    else if (m.type === 'chat') addChat(m)
    else if (m.type === 'send_result') {
      const note = $('#sendNote')
      note.className = 'note ' + (m.ok ? 'ok' : 'bad')
      note.textContent = m.ok ? 'أُرسلت الرسالة.' : `تعذّر الإرسال: ${m.error}`
      if (m.ok) $('#text').value = ''
    }
  }
}

// ---------- أحداث الواجهة ----------
$('#sendForm').addEventListener('submit', (e) => {
  e.preventDefault()
  if (ws?.readyState !== 1) return
  ws.send(JSON.stringify({ type: 'send', to: $('#to').value, text: $('#text').value }))
  $('#sendNote').className = 'note'
  $('#sendNote').textContent = 'جارٍ الإرسال…'
})

for (const id of ['#fDecoded', '#fRaw', '#fText']) $(id).addEventListener('input', renderAll)

$('#pauseBtn').addEventListener('click', () => {
  paused = !paused
  if (!paused) { pending = 0; renderAll() }
  $('#pauseBtn').textContent = paused ? 'تابع العرض' : 'أوقف العرض'
})

$('#clearBtn').addEventListener('click', () => { frames = []; pending = 0; renderAll() })

$('#saveBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(frames, null, 2)], { type: 'application/json' })
  const a = el('a')
  a.href = URL.createObjectURL(blob)
  a.download = `wa-frames-${Date.now()}.json`
  a.click()
  URL.revokeObjectURL(a.href)
})

renderState({ status: 'bridge_down' })
renderAll()
connect()
</script>
</body>
</html>
